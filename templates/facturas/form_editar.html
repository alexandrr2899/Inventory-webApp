{% extends "base.html" %}
{% block title %}Editar documento {{ doc.pk }}{% endblock %}
{% block content %}
<h1>Editar documento {{ doc.pk }}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Guardar</button>
  <a href="{% url 'factura_detalle' doc.pk %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
