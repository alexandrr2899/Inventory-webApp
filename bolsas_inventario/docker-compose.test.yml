# Override para probar el refactor en un container aparte (puerto 8005).
# Hornea el código en la imagen (igual que prod) — NO se puede bind-montar la
# fuente porque vive en iCloud Drive (da "Resource deadlock avoided").
# Reusa el servicio db existente.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml build web-test
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d web-test
services:
  web-test:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "8005:8000"
    volumes:
      - static_files_test:/app/staticfiles
      - media_files:/app/media
    environment:
      SECRET_KEY:           ${SECRET_KEY}
      DEBUG:                ${DEBUG:-False}
      ALLOWED_HOSTS:        ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST:              db
      DB_NAME:              ${DB_NAME:-bolsas_inventario}
      DB_USER:              ${DB_USER:-bolsas_user}
      DB_PASSWORD:          ${DB_PASSWORD}
      DB_PORT:              ${DB_PORT:-5432}
      N8N_WEBHOOK_URL:      ${N8N_WEBHOOK_URL:-}
      ADMIN_URL:            ${ADMIN_URL:-gestion-interna/}
    depends_on:
      db:
        condition: service_healthy

volumes:
  static_files_test:
