{% extends "base.html" %}
{% block title %}Nueva Salida{% endblock %}

{% block content %}
<div class="page-header" style="background: linear-gradient(135deg,#dc3545,#842029);">
  <h1><i class="bi bi-arrow-up-circle-fill me-2"></i>Nueva Salida</h1>
  <small class="opacity-75">Podés registrar varios ítems de una sola vez</small>
</div>

<form method="post" novalidate id="form-salida">
  {% csrf_token %}

  <!-- Encabezado común -->
  <div class="card mb-3">
    <div class="card-header bg-white fw-bold">Datos generales</div>
    <div class="card-body">
      <div class="col-12 col-md-6">
        <label class="form-label">Motivo / Descripción</label>
        <input type="text" name="motivo" class="form-control form-control-lg"
               placeholder="Ej: Despacho cliente, mantenimiento...">
      </div>
    </div>
  </div>

  <!-- Lista de ítems (una card por ítem, funciona en mobile y desktop) -->
  <div class="card mb-3">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span class="fw-bold"><i class="bi bi-table me-2"></i>Ítems a retirar</span>
      <button type="button" id="btn-agregar" class="btn btn-danger btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Agregar ítem
      </button>
    </div>
    <div class="card-body" id="contenedor-filas">
      <div class="text-center py-2 text-muted" id="hint-empty">
        <i class="bi bi-arrow-up-circle me-1"></i>
        Presioná <strong>Agregar ítem</strong> para comenzar
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 flex-wrap">
    <button type="submit" class="btn btn-danger btn-lg flex-fill flex-md-grow-0">
      <i class="bi bi-check-lg me-2"></i>Registrar <span id="contador-label">salida</span>
    </button>
    <a href="{% url 'movimiento_lista' %}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
  </div>
</form>

<!-- Datos para JS -->
<script>
const ITEMS_OPTS = [{ value: '', label: '-- Seleccionar ítem --', tipo: '', unidad: '' },
  {% for item in items %}
  { value: '{{ item.pk }}', label: '{{ item.nombre|escapejs }} ({{ item.codigo|escapejs }})', tipo: '{{ item.tipo }}', unidad: '{{ item.unidad_medida|escapejs }}' },
  {% endfor %}
];

const UBICACIONES_OPTS = [{ value: '', label: '-- Ubicación --' },
  {% for ub in ubicaciones %}{ value: '{{ ub.pk }}', label: '{{ ub.nombre|escapejs }}' },{% endfor %}
];

const CLIENTES_OPTS = [{ value: '', label: '-- Cliente --' },
  {% for c in clientes %}{ value: '{{ c.pk }}', label: '{{ c.nombre|escapejs }}' },{% endfor %}
];

const MAQUINAS_OPTS = [{ value: '', label: '-- Máquina --' },
  {% for m in maquinas %}{ value: '{{ m.pk }}', label: '{{ m.nombre|escapejs }}' },{% endfor %}
];

function buildSelect(name, opts, required = false) {
  const sel = document.createElement('select');
  sel.name = name;
  sel.className = 'form-select';
  if (required) sel.required = true;
  opts.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.label;
    sel.appendChild(opt);
  });
  return sel;
}
</script>
{% endblock %}

{% block extra_js %}
<script>
const contenedor  = document.getElementById('contenedor-filas');
const hintEmpty   = document.getElementById('hint-empty');
const contadorLbl = document.getElementById('contador-label');
let filaCount = 0;

function actualizarContador() {
  const n = contenedor.querySelectorAll('.fila-salida').length;
  hintEmpty.style.display = n === 0 ? '' : 'none';
  contadorLbl.textContent = n <= 1 ? 'salida' : `${n} salidas`;
}

function agregarFila() {
  filaCount++;
  const idx = filaCount;

  const wrap = document.createElement('div');
  wrap.className = 'fila-salida border rounded-3 p-3 mb-3 position-relative';

  // Cabecera de la fila
  const header = document.createElement('div');
  header.className = 'd-flex justify-content-between align-items-center mb-3';
  header.innerHTML = `<span class="fw-semibold text-muted small">Ítem #${idx}</span>`;
  const btnDel = document.createElement('button');
  btnDel.type = 'button';
  btnDel.className = 'btn btn-outline-danger btn-sm';
  btnDel.innerHTML = '<i class="bi bi-trash-fill"></i>';
  btnDel.addEventListener('click', () => { wrap.remove(); actualizarContador(); });
  header.appendChild(btnDel);
  wrap.appendChild(header);

  // Grid de campos
  const grid = document.createElement('div');
  grid.className = 'row g-3';
  wrap.appendChild(grid);

  // ── Ítem ──────────────────────────────────────────────────────
  const colItem = document.createElement('div');
  colItem.className = 'col-12 col-md-4';
  const lblItem = document.createElement('label');
  lblItem.className = 'form-label';
  lblItem.textContent = 'Ítem *';
  const selItem = buildSelect('item[]', ITEMS_OPTS, true);
  const stockDiv = document.createElement('div');
  stockDiv.className = 'text-muted small mt-1 d-none';
  stockDiv.innerHTML = '<i class="bi bi-box-fill me-1"></i>Stock: <span class="stock-val">–</span>';
  colItem.append(lblItem, selItem, stockDiv);
  grid.appendChild(colItem);

  // ── Cantidad ──────────────────────────────────────────────────
  const colCant = document.createElement('div');
  colCant.className = 'col-6 col-md-2';
  const lblCant = document.createElement('label');
  lblCant.className = 'form-label';
  lblCant.textContent = 'Cantidad *';
  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';
  const inputCant = document.createElement('input');
  inputCant.type = 'number';
  inputCant.name = 'cantidad[]';
  inputCant.className = 'form-control';
  inputCant.placeholder = '0';
  inputCant.step = '0.01';
  inputCant.min = '0.01';
  inputCant.required = true;
  const unidadSpan = document.createElement('span');
  unidadSpan.className = 'input-group-text small text-muted unidad-lbl';
  unidadSpan.textContent = 'ud';
  inputGroup.append(inputCant, unidadSpan);
  colCant.append(lblCant, inputGroup);
  grid.appendChild(colCant);

  // ── Ubicación origen ──────────────────────────────────────────
  const colUb = document.createElement('div');
  colUb.className = 'col-6 col-md-3';
  const lblUb = document.createElement('label');
  lblUb.className = 'form-label';
  lblUb.textContent = 'Ubicación origen *';
  const selUb = buildSelect('ubicacion_origen[]', UBICACIONES_OPTS, true);
  colUb.append(lblUb, selUb);
  grid.appendChild(colUb);

  // ── Cliente (condicional) ──────────────────────────────────────
  const colCli = document.createElement('div');
  colCli.className = 'col-12 col-md-3 d-none';
  const lblCli = document.createElement('label');
  lblCli.className = 'form-label';
  lblCli.innerHTML = '<i class="bi bi-person-fill text-primary me-1"></i>Cliente *';
  const selCli = buildSelect('cliente[]', CLIENTES_OPTS);
  colCli.append(lblCli, selCli);
  grid.appendChild(colCli);

  // ── Máquina (condicional) ──────────────────────────────────────
  const colMaq = document.createElement('div');
  colMaq.className = 'col-12 col-md-3 d-none';
  const lblMaq = document.createElement('label');
  lblMaq.className = 'form-label';
  lblMaq.innerHTML = '<i class="bi bi-gear-fill text-warning me-1"></i>Máquina';
  const selMaq = buildSelect('maquina[]', MAQUINAS_OPTS);
  colMaq.append(lblMaq, selMaq);
  grid.appendChild(colMaq);

  // ── Lógica: cambio de ítem ────────────────────────────────────
  selItem.addEventListener('change', function() {
    const opt = ITEMS_OPTS.find(o => o.value === this.value);
    if (!opt || !opt.value) {
      colCli.classList.add('d-none');
      colMaq.classList.add('d-none');
      selCli.required = false;
      selMaq.required = false;
      stockDiv.classList.add('d-none');
      unidadSpan.textContent = 'ud';
      return;
    }

    unidadSpan.textContent = opt.unidad || 'ud';

    // Mostrar/ocultar campos condicionales
    const esProducto   = opt.tipo === 'producto';
    const esRepuesto   = opt.tipo === 'repuesto';
    const esConsumible = opt.tipo === 'consumible';

    colCli.classList.toggle('d-none', !esProducto);
    colMaq.classList.toggle('d-none', esProducto);
    selCli.required = esProducto;
    selMaq.required = esRepuesto;

    // Relabel según tipo
    lblMaq.innerHTML = esRepuesto
      ? '<i class="bi bi-gear-fill text-warning me-1"></i>Máquina *'
      : '<i class="bi bi-gear-fill text-warning me-1"></i>Máquina <span class="text-muted fw-normal">(opcional)</span>';

    // Obtener y mostrar stock
    fetch(`/api/item/${opt.value}/info/`)
      .then(r => r.json())
      .then(data => {
        stockDiv.querySelector('.stock-val').textContent = `${data.stock_total} ${opt.unidad}`;
        stockDiv.classList.remove('d-none');
      });
  });

  contenedor.insertBefore(wrap, hintEmpty);
  actualizarContador();
  selItem.focus();
}

document.getElementById('btn-agregar').addEventListener('click', agregarFila);

// Validar antes de enviar
document.getElementById('form-salida').addEventListener('submit', function(e) {
  if (contenedor.querySelectorAll('.fila-salida').length === 0) {
    e.preventDefault();
    alert('Agrega al menos un ítem antes de enviar.');
  }
});

// Primera fila al cargar
agregarFila();
</script>
{% endblock %}
