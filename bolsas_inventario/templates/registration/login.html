<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – Inventario Bolsas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; border-radius: 18px; border: none;
      box-shadow: 0 8px 40px rgba(0,0,0,.25); }
    .login-logo { font-size: 3rem; color: #0d6efd; }
    .btn-login { padding: 0.7rem; font-size: 1rem; font-weight: 600; border-radius: 10px; }
  </style>
</head>
<body>
<div class="container px-3">
  <div class="card login-card mx-auto">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="login-logo"><i class="bi bi-box-seam-fill"></i></div>
        <h4 class="fw-bold mt-2 mb-0">Inventario Bolsas</h4>
        <p class="text-muted small">Control de producción y stock</p>
      </div>

      {% if form.errors %}
      <div class="alert alert-danger py-2 small">
        <i class="bi bi-x-circle-fill me-1"></i>Usuario o contraseña incorrectos.
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="username" class="form-control form-control-lg"
                   placeholder="Tu usuario" autofocus required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" class="form-control form-control-lg"
                   placeholder="Tu contraseña" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
        </button>
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
