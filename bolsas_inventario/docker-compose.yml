services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${DB_NAME:-bolsas_inventario}
      POSTGRES_USER:     ${DB_USER:-bolsas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Sin "ports:" — la DB solo es accesible dentro de la red Docker interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bolsas_user} -d ${DB_NAME:-bolsas_inventario}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backup manual PostgreSQL ────────────────────────────────────────────────
  # No se levanta con "docker compose up"; se ejecuta manualmente:
  # docker compose run --rm backup
  backup:
    image: postgres:15-alpine
    profiles: ["maintenance"]
    restart: "no"
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    environment:
      POSTGRES_HOST:          ${POSTGRES_HOST:-db}
      POSTGRES_PORT:          ${DB_PORT:-5432}
      POSTGRES_DB:            ${DB_NAME:-bolsas_inventario}
      POSTGRES_USER:          ${DB_USER:-bolsas_user}
      POSTGRES_PASSWORD:      ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS:  ${BACKUP_RETENTION_DAYS:-14}
      TZ:                     ${TZ:-America/Tegucigalpa}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/scripts/backup_postgres.sh"]

  # ── Django / Gunicorn ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ${BACKUP_DIR:-./backups}:/backups
    environment:
      SECRET_KEY:           ${SECRET_KEY}
      DEBUG:                ${DEBUG:-False}
      ALLOWED_HOSTS:        ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST:              db
      DB_NAME:              ${DB_NAME:-bolsas_inventario}
      DB_USER:              ${DB_USER:-bolsas_user}
      DB_PASSWORD:          ${DB_PASSWORD}
      DB_PORT:              ${DB_PORT:-5432}
      POSTGRES_HOST:        ${POSTGRES_HOST:-db}
      POSTGRES_PORT:        ${DB_PORT:-5432}
      POSTGRES_DB:          ${DB_NAME:-bolsas_inventario}
      POSTGRES_USER:        ${DB_USER:-bolsas_user}
      POSTGRES_PASSWORD:    ${DB_PASSWORD}
      BACKUP_DIR:           /backups
      BACKUP_ROOT:          /backups/postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-300}
      N8N_WEBHOOK_URL:      ${N8N_WEBHOOK_URL:-}
      ADMIN_URL:            ${ADMIN_URL:-gestion-interna/}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  media_files:
