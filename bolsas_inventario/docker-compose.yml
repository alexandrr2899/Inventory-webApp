services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${DB_NAME:-bolsas_inventario}
      POSTGRES_USER:     ${DB_USER:-bolsas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Sin "ports:" — la DB solo es accesible dentro de la red Docker interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bolsas_user} -d ${DB_NAME:-bolsas_inventario}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Django / Gunicorn ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    environment:
      SECRET_KEY:           ${SECRET_KEY}
      DEBUG:                ${DEBUG:-False}
      ALLOWED_HOSTS:        ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST:              db
      DB_NAME:              ${DB_NAME:-bolsas_inventario}
      DB_USER:              ${DB_USER:-bolsas_user}
      DB_PASSWORD:          ${DB_PASSWORD}
      DB_PORT:              ${DB_PORT:-5432}
      N8N_WEBHOOK_URL:      ${N8N_WEBHOOK_URL:-}
      ADMIN_URL:            ${ADMIN_URL:-gestion-interna/}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  media_files:
