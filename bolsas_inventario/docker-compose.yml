services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${DB_NAME:-bolsas_inventario}
      POSTGRES_USER:     ${DB_USER:-bolsas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Sin "ports:" — la DB solo es accesible dentro de la red Docker interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bolsas_user} -d ${DB_NAME:-bolsas_inventario}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backup manual PostgreSQL ────────────────────────────────────────────────
  backup:
    image: postgres:15-alpine
    profiles: ["maintenance"]
    restart: "no"
    volumes:
      - ../scripts:/scripts:ro
      - ${BACKUP_DIR:-../backups}:/backups
    environment:
      POSTGRES_HOST:          ${POSTGRES_HOST:-db}
      POSTGRES_PORT:          ${DB_PORT:-5432}
      POSTGRES_DB:            ${DB_NAME:-bolsas_inventario}
      POSTGRES_USER:          ${DB_USER:-bolsas_user}
      POSTGRES_PASSWORD:      ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS:  ${BACKUP_RETENTION_DAYS:-14}
      TZ:                     ${TZ:-America/Tegucigalpa}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/scripts/backup_postgres.sh"]

  # ── Redis (caché compartida entre workers) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Sin "ports:" — solo accesible dentro de la red Docker interna.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Django / Gunicorn ───────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ${BACKUP_DIR:-../backups}:/backups
    environment:
      SECRET_KEY:           ${SECRET_KEY}
      DEBUG:                ${DEBUG:-False}
      ALLOWED_HOSTS:        ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST:              db
      DB_NAME:              ${DB_NAME:-bolsas_inventario}
      DB_USER:              ${DB_USER:-bolsas_user}
      DB_PASSWORD:          ${DB_PASSWORD}
      DB_PORT:              ${DB_PORT:-5432}
      POSTGRES_HOST:        ${POSTGRES_HOST:-db}
      POSTGRES_PORT:        ${DB_PORT:-5432}
      POSTGRES_DB:          ${DB_NAME:-bolsas_inventario}
      POSTGRES_USER:        ${DB_USER:-bolsas_user}
      POSTGRES_PASSWORD:    ${DB_PASSWORD}
      BACKUP_DIR:           /backups
      BACKUP_ROOT:          /backups/postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-300}
      N8N_WEBHOOK_URL:      ${N8N_WEBHOOK_URL:-}
      VAPID_PUBLIC_KEY:     ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:    ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:        ${VAPID_SUBJECT:-}
      FACTURAS_INGEST_TOKEN: ${FACTURAS_INGEST_TOKEN:-}
      ADMIN_URL:            ${ADMIN_URL:-gestion-interna/}
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL:     ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Web Push: tareas en segundo plano ─────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - media_files:/app/media
    environment:
      SECRET_KEY:           ${SECRET_KEY}
      DEBUG:                ${DEBUG:-False}
      ALLOWED_HOSTS:        ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST:              db
      DB_NAME:              ${DB_NAME:-bolsas_inventario}
      DB_USER:              ${DB_USER:-bolsas_user}
      DB_PASSWORD:          ${DB_PASSWORD}
      DB_PORT:              ${DB_PORT:-5432}
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL:     ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      VAPID_PUBLIC_KEY:     ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:    ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:        ${VAPID_SUBJECT:-}
      N8N_WEBHOOK_URL:      ${N8N_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Web Push: horario de facturas vencidas ────────────────────────────────
  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    entrypoint: []
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    environment:
      SECRET_KEY:           ${SECRET_KEY}
      DEBUG:                ${DEBUG:-False}
      ALLOWED_HOSTS:        ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST:              db
      DB_NAME:              ${DB_NAME:-bolsas_inventario}
      DB_USER:              ${DB_USER:-bolsas_user}
      DB_PASSWORD:          ${DB_PASSWORD}
      DB_PORT:              ${DB_PORT:-5432}
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL:     ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      VAPID_PUBLIC_KEY:     ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:    ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:        ${VAPID_SUBJECT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  media_files:
